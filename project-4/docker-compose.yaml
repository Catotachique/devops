services:
  # FastAPI Backend (User Service)
  user-service:
    build: ./backend/user-service
    container_name: user-service
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - DATABASE_URL=mongodb://mongodb:27017/userdb
'''
  # React Frontend
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - user-service

  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # API Gateway (Kong)
  api-gateway:
    image: kong
    container_name: api-gateway
    restart: always
    ports:
      - "8001:8001"
      - "8443:8443"
    volumes:
      - ./api-gateway/kong.yml:/etc/kong/kong.yml
    depends_on:
      - user-service
'''
volumes:
  mongo_data: